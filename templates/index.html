<!DOCTYPE html>
<html>
<head>
    <title>Threat Intelligence Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center text-primary">
        Threat Intelligence Platform
    </h1>

    <hr>

    <div class="row mt-4">

        <div class="col-md-4">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <h5>Total Threats</h5>
                    <h2>{{ total }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-bg-danger">
                <div class="card-body">
                    <h5>High Risk Threats</h5>
                    <h2>{{ high_risk }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-bg-success">
                <div class="card-body">
                    <h5>Blocked IPs</h5>
                    <h2>{{ blocked }}</h2>
                </div>
            </div>
        </div>

    </div>

    <hr>

    <h3>Threat List</h3>

    <table class="table table-bordered table-striped">

        <thead>
            <tr>
                <th>IP</th>
                <th>Domain</th>
                <th>Risk Score</th>
            </tr>
        </thead>

        <tbody>

        {% for threat in threats %}

        <tr>
            <td>{{ threat.ip }}</td>
            <td>{{ threat.domain }}</td>
            <td>{{ threat.risk_score }}</td>
        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
